<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECE 2111 Magnetic Fields Simulator</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0f172a;
  color:#e5e7eb;
}
header{
  text-align:center;
  padding:24px 16px;
  border-bottom:1px solid #334155;
  background:#111827;
}
h1{margin:0;font-size:28px}
header p{margin:7px 0 0;color:#94a3b8}
.app{max-width:1200px;margin:auto;padding:18px}
.tabs{
  display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;
}
.tab{
  border:0;border-radius:8px;padding:11px 15px;
  background:#1e293b;color:#e5e7eb;cursor:pointer;font-weight:bold;
}
.tab:hover{background:#334155}
.tab.active{background:#2563eb}
.grid{
  display:grid;grid-template-columns:280px 1fr;gap:16px;
}
.panel,.visual,.card{
  background:#1e293b;border:1px solid #334155;border-radius:12px;
}
.panel{padding:18px}
.panel h2{margin:0 0 18px;font-size:19px}
.control{margin:16px 0}
.control label{
  display:flex;justify-content:space-between;gap:10px;
  margin-bottom:7px;font-size:14px;color:#cbd5e1;
}
input[type=range]{width:100%;accent-color:#60a5fa}
.value{
  color:#60a5fa;font-weight:bold;white-space:nowrap;
}
.buttons{display:flex;gap:8px;margin-top:18px}
button.action{
  flex:1;border:0;border-radius:7px;padding:9px;
  background:#334155;color:white;cursor:pointer;
}
button.action:hover{background:#475569}
.visual{padding:12px}
canvas{
  width:100%;height:auto;display:block;
  background:#0b1220;border-radius:9px;
}
.results{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;
}
.card{padding:14px}
.card small{color:#94a3b8}
.big{font-size:23px;font-weight:bold;color:#60a5fa;margin-top:5px}
.formula{
  margin-top:10px;padding:14px;border-radius:8px;
  background:#172554;color:#dbeafe;font-size:18px;
  text-align:center;font-family:Georgia,serif;
}
.explain{
  margin-top:10px;padding:15px;border-radius:8px;
  background:#111827;line-height:1.55;color:#cbd5e1;
}
.note{
  margin-top:10px;color:#94a3b8;font-size:13px;line-height:1.45;
}
.hidden{display:none}
@media(max-width:800px){
  .grid{grid-template-columns:1fr}
  .results{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <h1>ECE 2111 Magnetic Fields Simulator</h1>
  <p>Interactive potangina galing </p>
</header>

<div class="app">
  <div class="tabs">
    <button class="tab active" data-topic="straight">Straight Wire</button>
    <button class="tab" data-topic="biot">Biot-Savart</button>
    <button class="tab" data-topic="parallel">Parallel Wires</button>
    <button class="tab" data-topic="ampere">Ampere's Law</button>
    <button class="tab" data-topic="solid">Solid Wire</button>
    <button class="tab" data-topic="solenoid">Solenoid</button>
    <button class="tab" data-topic="toroid">Toroid</button>
  </div>

  <div class="grid">
    <section class="panel" id="controls"></section>

    <section>
      <div class="visual">
        <canvas id="canvas" width="850" height="430"></canvas>
      </div>

      <div class="results">
        <div class="card">
          <small>Calculated Result</small>
          <div class="big" id="result">—</div>
        </div>
        <div class="card">
          <small>Concept</small>
          <div class="big" id="concept">—</div>
        </div>
      </div>

      <div class="formula" id="formula">—</div>
      <div class="explain" id="explain">—</div>
    </section>
  </div>
</div>

<script>
const MU0 = 4*Math.PI*1e-7;
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let topic = "straight";
let playing = true;
let t = 0;

const state = {
  straight:{I:5,r:5},
  biot:{I:5,R:3,theta:90},
  parallel:{I1:5,I2:5,d:10},
  ampere:{I:5,r:5},
  solid:{I:5,a:5,r:2.5},
  solenoid:{N:1000,L:50,I:2},
  toroid:{N:500,I:2,a:4,b:8,r:6}
};

const defs = {
  straight:{
    title:"Long Straight Wire",
    controls:[
      ["I","Current I (A)",0.5,20,0.5],
      ["r","Distance r (cm)",1,20,0.5]
    ],
    formula:"B = μ₀I / (2πr)",
    explain:()=>`For a long straight wire, the magnetic field increases when current I increases and decreases as perpendicular distance r increases. Field lines form circles around the wire. Use the right-hand rule for direction.`,
    concept:()=>`B ∝ I and B ∝ 1/r`,
    calc:()=>MU0*state.straight.I/(2*Math.PI*(state.straight.r/100)),
    result:x=>fmt(x)+" T"
  },
  biot:{
    title:"Biot–Savart Law",
    controls:[
      ["I","Current I (A)",0.5,20,0.5],
      ["R","Distance R (cm)",1,20,0.5],
      ["theta","Angle θ (degrees)",0,180,1]
    ],
    formula:"dB = (μ₀/4π) · I dℓ sinθ / R²",
    explain:()=>`The contribution dB depends on current, distance, and the angle between dℓ and R. θ = 90° gives the maximum contribution; θ = 0° or 180° gives zero.`,
    concept:()=>`Maximum at θ = 90°`,
    calc:()=>MU0/(4*Math.PI)*state.biot.I*Math.sin(state.biot.theta*Math.PI/180)/(state.biot.R/100)**2,
    result:x=>fmt(x)+" T"
  },
  parallel:{
    title:"Parallel Current-Carrying Wires",
    controls:[
      ["I1","Current I₁ (A)",0.5,20,0.5],
      ["I2","Current I₂ (A)",0.5,20,0.5],
      ["d","Separation d (cm)",1,30,1]
    ],
    formula:"F/L = μ₀|I₁I₂| / (2πd)",
    explain:()=>`Same-direction currents attract. Opposite-direction currents repel. The force per unit length increases with both currents and decreases with separation.`,
    concept:()=>`Same direction → ATTRACT`,
    calc:()=>MU0*state.parallel.I1*state.parallel.I2/(2*Math.PI*(state.parallel.d/100)),
    result:x=>fmt(x)+" N/m"
  },
  ampere:{
    title:"Ampere's Law",
    controls:[
      ["I","Enclosed current I (A)",0.5,20,0.5],
      ["r","Ampere-loop radius r (cm)",1,20,0.5]
    ],
    formula:"∮ B·dℓ = μ₀ Iₑₙc",
    explain:()=>`Ampere's law relates the circulation of B around a closed path to the net enclosed current. It is especially useful when symmetry makes B constant along the chosen path.`,
    concept:()=>`Closed path + enclosed current`,
    calc:()=>MU0*state.ampere.I/(2*Math.PI*(state.ampere.r/100)),
    result:x=>fmt(x)+" T"
  },
  solid:{
    title:"Solid Cylindrical Wire",
    controls:[
      ["I","Total current I (A)",0.5,20,0.5],
      ["a","Wire radius a (cm)",1,10,0.5],
      ["r","Position r (cm)",0.1,10,0.1]
    ],
    formula:"Inside: B = μ₀Ir/(2πa²)   |   Outside: B = μ₀I/(2πr)",
    explain:()=>{
      const s=state.solid;
      if(s.r<s.a) return `Inside the wire, assuming uniform current density, enclosed current increases with r. Therefore B increases linearly with r and is zero at the center.`;
      if(Math.abs(s.r-s.a)<0.06) return `At the surface r = a, the inside and outside expressions meet. This is where the field is maximum for this model.`;
      return `Outside the wire, the entire current is enclosed, so the field decreases as 1/r.`;
    },
    concept:()=>state.solid.r<=state.solid.a ? `INSIDE: B ∝ r` : `OUTSIDE: B ∝ 1/r`,
    calc:()=>{
      const s=state.solid, a=s.a/100, r=s.r/100;
      return r<=a ? MU0*s.I*r/(2*Math.PI*a*a) : MU0*s.I/(2*Math.PI*r);
    },
    result:x=>fmt(x)+" T"
  },
  solenoid:{
    title:"Ideal Solenoid",
    controls:[
      ["N","Number of turns N",100,2000,50],
      ["L","Length L (cm)",10,100,1],
      ["I","Current I (A)",0.2,10,0.1]
    ],
    formula:"B = μ₀nI = μ₀NI/L",
    explain:()=>`For an ideal long solenoid, the magnetic field is approximately uniform inside and points along the axis. Outside the ideal solenoid, the field is approximately zero. Increasing N or I increases B; increasing L decreases B when N is fixed.`,
    concept:()=>`UNIFORM INSIDE`,
    calc:()=>MU0*state.solenoid.N*state.solenoid.I/(state.solenoid.L/100),
    result:x=>fmt(x)+" T"
  },
  toroid:{
    title:"Toroid",
    controls:[
      ["N","Number of turns N",50,1500,50],
      ["I","Current I (A)",0.2,10,0.1],
      ["a","Inner radius a (cm)",2,10,0.5],
      ["b","Outer radius b (cm)",4,15,0.5],
      ["r","Position r (cm)",1,16,0.5]
    ],
    formula:"For a < r < b: B = μ₀NI/(2πr)",
    explain:()=>{
      const s=state.toroid;
      if(s.r<=s.a) return `Inside the hole (r < a), an Ampere loop encloses no net current, so the ideal toroid field is approximately zero.`;
      if(s.r>=s.b) return `Outside the toroid (r > b), the ideal field is approximately zero.`;
      return `Within the winding region (a < r < b), B varies as 1/r. It is therefore not perfectly uniform across a thick toroid.`;
    },
    concept:()=>`a < r < b → B ∝ 1/r`,
    calc:()=>{
      const s=state.toroid;
      if(s.r<=s.a || s.r>=s.b) return 0;
      return MU0*s.N*s.I/(2*Math.PI*(s.r/100));
    },
    result:x=>fmt(x)+" T"
  }
};

function fmt(x){
  if(!isFinite(x)) return "—";
  if(x===0) return "0";
  if(Math.abs(x)>=0.001) return x.toFixed(4);
  return x.toExponential(3);
}

function setTopic(name){
  topic=name;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.topic===name));
  buildControls();
  update();
}

function buildControls(){
  const d=defs[topic], s=state[topic];
  const box=document.getElementById("controls");
  let h=`<h2>${d.title}</h2>`;
  d.controls.forEach(c=>{
    const [key,label,min,max,step]=c;
    h+=`
      <div class="control">
        <label><span>${label}</span><span class="value" id="v-${key}">${s[key]}</span></label>
        <input type="range" id="i-${key}" min="${min}" max="${max}" step="${step}" value="${s[key]}">
      </div>`;
  });
  h+=`
    <div class="buttons">
      <button class="action" id="playBtn">${playing?"⏸ Pause":"▶ Play"}</button>
      <button class="action" id="resetBtn">↺ Reset</button>
    </div>
    <div class="note">
      Move the sliders and watch the animation respond. The arrows are a visual aid; use the equations for exact values.
    </div>`;
  box.innerHTML=h;

  d.controls.forEach(c=>{
    const key=c[0];
    const inp=document.getElementById("i-"+key);
    inp.addEventListener("input",()=>{
      state[topic][key]=Number(inp.value);
      if(topic==="solid" && key==="a"){
        const r=document.getElementById("i-r");
        r.max=Math.max(10,Number(inp.value)*2);
      }
      if(topic==="toroid" && key==="a"){
        const r=document.getElementById("i-r");
        r.max=Math.max(16,Number(inp.value)+8);
      }
      update();
    });
  });
  document.getElementById("playBtn").onclick=()=>{
    playing=!playing;
    document.getElementById("playBtn").textContent=playing?"⏸ Pause":"▶ Play";
  };
  document.getElementById("resetBtn").onclick=()=>{
    const defaults={
      straight:{I:5,r:5},biot:{I:5,R:3,theta:90},
      parallel:{I1:5,I2:5,d:10},ampere:{I:5,r:5},
      solid:{I:5,a:5,r:2.5},solenoid:{N:1000,L:50,I:2},
      toroid:{N:500,I:2,a:4,b:8,r:6}
    };
    state[topic]=JSON.parse(JSON.stringify(defaults[topic]));
    buildControls(); update();
  };
}

function update(){
  const d=defs[topic], s=state[topic];
  d.controls.forEach(c=>{
    const key=c[0], v=document.getElementById("v-"+key), inp=document.getElementById("i-"+key);
    if(v) v.textContent=s[key];
    if(inp && Number(inp.value)!==s[key]) inp.value=s[key];
  });
  const value=d.calc();
  document.getElementById("result").textContent=d.result(value);
  document.getElementById("concept").textContent=d.concept();
  document.getElementById("formula").textContent=d.formula;
  document.getElementById("explain").textContent=d.explain();
  draw();
}

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTopic(b.dataset.topic)));

function clear(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#0b1220";
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function line(x1,y1,x2,y2,color="#60a5fa",w=2){
  ctx.strokeStyle=color;ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}

function arrow(x1,y1,x2,y2,color="#60a5fa",w=2){
  line(x1,y1,x2,y2,color,w);
  const a=Math.atan2(y2-y1,x2-x1), size=8;
  ctx.fillStyle=color;ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-size*Math.cos(a-0.5),y2-size*Math.sin(a-0.5));
  ctx.lineTo(x2-size*Math.cos(a+0.5),y2-size*Math.sin(a+0.5));
  ctx.closePath();ctx.fill();
}

function text(str,x,y,size=15,color="#cbd5e1",align="center"){
  ctx.fillStyle=color;ctx.font=`${size}px Arial`;ctx.textAlign=align;
  ctx.fillText(str,x,y);
}

function dot(x,y,r=4,color="#38bdf8"){
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}

function draw(){
  clear();
  if(topic==="straight") drawStraight();
  if(topic==="biot") drawBiot();
  if(topic==="parallel") drawParallel();
  if(topic==="ampere") drawAmpere();
  if(topic==="solid") drawSolid();
  if(topic==="solenoid") drawSolenoid();
  if(topic==="toroid") drawToroid();
}

function drawStraight(){
  const s=state.straight,cx=425,cy=215;
  text("CURRENT OUT OF PAGE  ⊙",cx,30,16,"#f8fafc");
  // wire
  ctx.fillStyle="#f59e0b";ctx.beginPath();ctx.arc(cx,cy,27,0,Math.PI*2);ctx.fill();
  text("I",cx,221,18,"#111827");
  const rpx=50+s.r*8;
  for(let k=0;k<5;k++){
    const rad=rpx*(0.45+k*0.16);
    ctx.strokeStyle="rgba(96,165,250,.35)";
    ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.stroke();
    for(let j=0;j<8;j++){
      const a=j*Math.PI/4 + t*(0.8+0.08*s.I)*(k%2?1:-1);
      const x1=cx+rad*Math.cos(a),y1=cy+rad*Math.sin(a);
      const x2=cx+rad*Math.cos(a+0.18),y2=cy+rad*Math.sin(a+0.18);
      arrow(x1,y1,x2,y2);
    }
  }
  text("Field lines rotate around the wire",cx,390,16);
  text(`r = ${s.r} cm`,cx,414,14,"#94a3b8");
}

function drawBiot(){
  const s=state.biot,cx=425,cy=215;
  const ang=s.theta*Math.PI/180;
  text("Biot–Savart: field contribution depends on sinθ / R²",cx,30,15);
  line(250,cy,600,cy,"#f59e0b",5);
  arrow(330,cy,400,cy,"#f59e0b",4);
  text("dℓ / current direction",350,185,14,"#fbbf24");
  const px=cx+170*Math.cos(ang),py=cy-170*Math.sin(ang);
  line(cx,cy,px,py,"#94a3b8",2);
  text("R",px,py-10,14,"#cbd5e1");
  ctx.strokeStyle="#60a5fa";ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cx,cy,55,-ang,0);ctx.stroke();
  text(`θ = ${s.theta}°`,cx,350,18,"#60a5fa");
  const strength=Math.abs(Math.sin(ang));
  const n=3+Math.round(strength*8);
  for(let i=0;i<n;i++){
    const a=i*2*Math.PI/n+t*(0.4+strength);
    const rr=75+i*15;
    arrow(cx+rr*Math.cos(a),cy+rr*Math.sin(a),
          cx+(rr+18*strength)*Math.cos(a),cy+(rr+18*strength)*Math.sin(a));
  }
}

function drawParallel(){
  const s=state.parallel;
  const x1=280,x2=570;
  const same=Math.sign(s.I1)===Math.sign(s.I2);
  // sliders only positive here, so same-direction animation
  text("Two parallel currents",425,30,17);
  line(x1,80,x1,350,"#f59e0b",8);
  line(x2,80,x2,350,"#f59e0b",8);
  text("I₁",x1,65,17,"#fbbf24");
  text("I₂",x2,65,17,"#fbbf24");
  for(let i=0;i<7;i++){
    const y=95+((i*45+t*55)%300);
    arrow(x1,y,x1,y+25,"#38bdf8",3);
    arrow(x2,y,x2,y+25,"#38bdf8",3);
  }
  const dir=same?1:-1;
  arrow(x1-50,215,x1-5,215,dir>0?"#22c55e":"#ef4444",5);
  arrow(x2+50,215,x2+5,215,dir>0?"#22c55e":"#ef4444",5);
  text(same?"ATTRACT":"REPEL",425,390,22,same?"#22c55e":"#ef4444");
  text(`d = ${s.d} cm`,425,414,14,"#94a3b8");
}

function drawAmpere(){
  const s=state.ampere,cx=425,cy=215;
  text("Ampere loop around a current-carrying wire",cx,30,15);
  ctx.fillStyle="#f59e0b";ctx.beginPath();ctx.arc(cx,cy,25,0,Math.PI*2);ctx.fill();
  text("⊙",cx,222,22,"#111827");
  const rad=70+s.r*5;
  ctx.strokeStyle="#a78bfa";ctx.lineWidth=3;
  ctx.setLineDash([8,6]);ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  for(let j=0;j<10;j++){
    const a=j*2*Math.PI/10+t*0.9;
    arrow(cx+rad*Math.cos(a),cy+rad*Math.sin(a),
          cx+rad*Math.cos(a+0.16),cy+rad*Math.sin(a+0.16),"#60a5fa",2);
  }
  text("closed path",cx,cy+rad+30,15,"#c4b5fd");
  text(`Iₑₙc = ${s.I} A`,cx,395,15);
}

function drawSolid(){
  const s=state.solid,cx=425,cy=215;
  const R=40+s.a*12;
  text("Uniform-current solid cylindrical wire",cx,30,15);
  ctx.fillStyle="#f59e0b";ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#fde68a";ctx.lineWidth=3;ctx.stroke();
  // moving current dots
  for(let i=0;i<30;i++){
    const rr=Math.sqrt((i+1)/31)*R*0.88;
    const a=i*2.399+t*(0.5+0.05*s.I);
    dot(cx+rr*Math.cos(a),cy+rr*Math.sin(a),3,"#0ea5e9");
  }
  const rp=Math.min(R, s.r/s.a*R);
  ctx.strokeStyle="#c4b5fd";ctx.lineWidth=2;ctx.setLineDash([6,5]);
  ctx.beginPath();ctx.arc(cx,cy,rp,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  text(`r = ${s.r} cm`,cx,cy+R+32,15);
  text(s.r<s.a?"INSIDE: B increases with r":"OUTSIDE: B decreases as 1/r",cx,395,17,s.r<s.a?"#60a5fa":"#fbbf24");
}

function drawSolenoid(){
  const s=state.solenoid;
  const left=160,right=690,cy=215;
  text("UNIFORM MAGNETIC FIELD INSIDE",425,30,17);
  const turns=Math.max(9,Math.min(18,Math.round(s.N/90)));
  for(let i=0;i<turns;i++){
    const x=left+i*(right-left)/(turns-1);
    ctx.strokeStyle="#f8fafc";ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(x,cy,15,72,0,0,Math.PI*2);ctx.stroke();
  }
  const speed=40+8*s.I;
  for(let row=0;row<4;row++){
    const y=cy-45+row*30;
    for(let j=0;j<7;j++){
      const x=left+((j*90+t*speed)%(right-left));
      arrow(x,y,x+38,y,"#60a5fa",3);
    }
  }
  text("→  field direction along the axis  →",425,350,17,"#60a5fa");
  text(`N = ${s.N} turns, L = ${s.L} cm, I = ${s.I} A`,425,390,15);
  text("Outside ideal field ≈ 0",425,415,14,"#94a3b8");
}

function drawToroid(){
  const s=state.toroid,cx=425,cy=215;
  const outer=145,inner=75;
  text("TOROID: FIELD CIRCULATES WITHIN THE CORE",cx,30,16);
  ctx.strokeStyle="#f59e0b";ctx.lineWidth=50;
  ctx.beginPath();ctx.arc(cx,cy,110,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle="#fde68a";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,85,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,135,0,Math.PI*2);ctx.stroke();

  for(let j=0;j<14;j++){
    const a=j*2*Math.PI/14+t*(0.7+0.06*s.I);
    const rr=110;
    arrow(cx+rr*Math.cos(a),cy+rr*Math.sin(a),
          cx+rr*Math.cos(a+0.15),cy+rr*Math.sin(a+0.15),"#60a5fa",3);
  }
  const rp=45+s.r*9;
  ctx.strokeStyle="#c4b5fd";ctx.lineWidth=2;ctx.setLineDash([6,5]);
  ctx.beginPath();ctx.arc(cx,cy,Math.max(20,Math.min(170,rp)),0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  if(s.r<=s.a) text("r < a  →  B = 0",cx,385,17,"#f87171");
  else if(s.r>=s.b) text("r > b  →  B = 0",cx,385,17,"#f87171");
  else text("a < r < b  →  B = μ₀NI/(2πr)",cx,385,17,"#60a5fa");
  text(`a=${s.a} cm   r=${s.r} cm   b=${s.b} cm`,cx,415,14,"#94a3b8");
}

function animate(){
  if(playing) t+=0.016;
  draw();
  requestAnimationFrame(animate);
}

buildControls();
update();
animate();
</script>
